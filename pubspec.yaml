name: mizo_bible
description: "Mizo/English parallel Bible reader - offline-first, free to read."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Cloud (phases 7-9) ---
  supabase_flutter: ^2.17.2

  # --- Local database ---
  # drift generates type-safe SQL from Dart table definitions.
  # drift_flutter pulls in the bundled native SQLite, so the app does NOT use
  # Android's system SQLite (whose version varies by OS release). That matters
  # because we depend on predictable FTS5 behaviour.
  # Do not add sqlite3_flutter_libs directly -- it is now an EOL shim that
  # drift_flutter depends on for us.
  drift: ^2.35.2
  drift_flutter: ^0.3.1

  # --- State management ---
  flutter_riverpod: ^3.4.3

  # --- Reader ---
  # Needed for two things a plain ListView cannot do with unknown item heights:
  # jump to an arbitrary verse, and report which verse is currently on screen.
  scrollable_positioned_list: ^0.3.8

  # --- Platform / utils ---
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.3
  uuid: ^4.6.0
  share_plus: ^13.3.1
  purchases_flutter: ^10.15.2
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation: run `dart run build_runner build` after changing
  # any Drift table or Riverpod provider.
  build_runner: ^2.4.13
  drift_dev: ^2.35.1

  # riverpod_lint catches provider misuse at analyze time.
  # custom_lint is pulled in transitively by riverpod_lint -- do not pin it
  # directly, the two have a narrow compatible range via analyzer_plugin.
  riverpod_lint: ^3.1.9

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # Generates lib/l10n/app_localizations.dart from the .arb files.
  # English is the only filled locale for now; adding a Mizo UI later
  # means adding app_lus.arb, not touching widget code.
  generate: true

  assets:
    # Pre-built Bible database, produced by tool/export_bible_db.py and
    # copied to the app documents directory on first launch.
    - assets/db/

  fonts:
    # The Mizo text needs T-with-dot-below (U+1E6C/U+1E6D) and circumflex
    # vowels. Android's default Roboto has patchy Latin Extended Additional
    # coverage, so these risk rendering as tofu boxes. Bundling Noto guarantees
    # the alphabet renders, offline, on every device. Verified: both files
    # contain U+1E6C, U+1E6D, U+00EA, U+00FB.
    #
    # These are VARIABLE fonts with wdth+wght axes. Declare each family once;
    # select weight at use time with TextStyle.fontVariations, not by listing
    # the same file under several `weight:` keys (which does not interpolate).
    # See lib/core/theme/app_typography.dart.
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Variable.ttf
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif-Variable.ttf
